<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Interactik Creator Elevate — Panel de control para creadores de TikTok LIVE. Metas, niveles, beneficios y métricas en tiempo real.">
    <meta name="theme-color" content="#0a0b0f">
    <title>Interactik Agency | Creator Elevate</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/iconos/logo_morado.png">
    <link rel="apple-touch-icon" href="/iconos/logo_morado.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Creator Elevate">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      // Exponemos una promesa global para que el resto del JS espere a que el SDK esté listo
      // antes de llamar a login()/addTag(). Sin esto, el SDK puede no estar disponible cuando
      // el usuario inicia sesión y los tags/external_id nunca se aplican.
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalReady = new Promise((resolve) => {
        OneSignalDeferred.push(async function (OneSignal) {
          try {
            await OneSignal.init({
              appId: "fd362054-cfe2-4b90-97cb-a2374f48c5c0",
              serviceWorkerPath: "/OneSignalSDKWorker.js",
              serviceWorkerParam: { scope: "/" },
              allowLocalhostAsSecureOrigin: true,
              notifyButton: { enable: false },
            });
            resolve(OneSignal);
          } catch (err) {
            console.error('[OneSignal] init falló:', err);
            resolve(null);
          }
        });
      });
    </script>

    <!-- Google Fonts: Plus Jakarta Sans + Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <div id="app"><!-- Content injected by JS --></div>

    <!-- Application entrypoint (carga en cascada el resto vía import) -->
    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
